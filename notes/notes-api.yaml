apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
  labels:
    app: notes-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: notes-api
        image: ghcr.io/secure-ship/secureship/notes-api:431c1dde6ba5772ace422788270047507290b0b1
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres.notes.svc.cluster.local:5432/notes
        - name: SPRING_DATASOURCE_USERNAME
          value: notes
        - name: SPRING_DATASOURCE_PASSWORD
          value: notes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: notes
spec:
  selector:
    app: notes-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
