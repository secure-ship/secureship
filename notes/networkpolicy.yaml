apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notes-api-ingress
  namespace: notes
spec:
  podSelector:
    matchLabels:
      app: notes-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-app
  namespace: notes
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: notes-api
    ports:
    - protocol: TCP
      port: 5432
