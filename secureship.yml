# SecureShip pipeline configuration
# Priority: values in the caller's workflow `with:` block win over this file;
# anything missing here falls back to the pipeline's built-in default.
app-path: .
image-name: my-app
severity-cutoff: HIGH
build-branch: main
scanners:
  gitleaks: true
  semgrep: true
  trivy: true
  hadolint: true
  grype: true
