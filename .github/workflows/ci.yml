name: secureship-ci

on:
  push:
    branches: [vulnerable, fixed]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  secrets-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git --source /repo --redact -v

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --config p/java --config p/owasp-top-ten --error app/notes-api/src

  dependency-scan:
    name: Dependencies (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        run: docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --offline-scan --skip-dirs target /work/app/notes-api

  dockerfile-lint:
    name: Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold warning - < app/notes-api/Dockerfile

  build-and-sign:
    name: Build, SBOM & Sign
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fixed'
    needs: [secrets-scan, sast, dependency-scan, dockerfile-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image tag
        run: echo "IMAGE_TAG=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')/notes-api:latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/notes-api
          push: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan Image (Grype)
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.IMAGE_TAG }}
          fail-build: true
          severity-cutoff: critical

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign the published image (Keyless)
        run: cosign sign --yes ${{ env.IMAGE_TAG }}