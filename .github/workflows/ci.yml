name: secureship-ci

on:
  push:
    branches: [vulnerable, fixed]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  security-and-build:
    uses: ./.github/workflows/secureship-pipeline.yml
    with:
      app-path: "app/notes-api"
      image-name: "notes-api"
      severity-cutoff: "CRITICAL"