name: secureship-ci

on:
  push:
    branches: [vulnerable, fixed]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  secrets-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git --source /repo --redact -v

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --config p/java --config p/owasp-top-ten --error app/notes-api/src

  dependency-scan:
    name: Dependencies (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        run: docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --offline-scan --skip-dirs target /work/app/notes-api

  dockerfile-lint:
    name: Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold warning - < app/notes-api/Dockerfile

  build-and-sign:
    name: Build, SBOM & Sign
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fixed'
    needs: [secrets-scan, sast, dependency-scan, dockerfile-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        run: |
          REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$REPO_LOWER/notes-api:latest" >> $GITHUB_ENV
          echo "IMAGE_TAG_SHA=ghcr.io/$REPO_LOWER/notes-api:${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local only)
        uses: docker/build-push-action@v5
        id: build
        with:
          context: ./app/notes-api
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_TAG_SHA }}

      - name: Scan Local Image (Grype)
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE_TAG }}
          fail-build: false # Changed to false so we can see the output

      - name: Show Grype Report
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:latest ${{ env.IMAGE_TAG }} -o table

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_TAG_SHA }}

      - name: Get Image Digest
        run: |
          D=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "DIGEST=${IMAGE_TAG%:*}@${D}" >> $GITHUB_ENV

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DIGEST }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Sign the image by digest
        run: cosign sign --yes ${{ env.DIGEST }}

      - name: Attach SBOM as attestation
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.DIGEST }}