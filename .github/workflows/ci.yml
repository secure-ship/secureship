name: secureship-ci

on:
  push:
    branches: [vulnerable, fixed]
  pull_request:
  workflow_dispatch:

jobs:
  security-and-build:
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: secure-ship/secureship/.github/workflows/secureship-pipeline.yml@v1.1.0
    with:
      app-path: "app/notes-api"
      image-name: "notes-api"
      severity-cutoff: "HIGH"
      build-branch: "fixed"

  deploy:
    needs: security-and-build
    permissions:
      contents: write
    uses: secure-ship/secureship/.github/workflows/secureship-deploy.yml@v1.1.0
    with:
      built: ${{ needs.security-and-build.outputs.built }}
      gitops-branch: gitops
      gitops-file: notes/notes-api.yaml
      image: ghcr.io/secure-ship/secureship/notes-api
      tag: ${{ needs.security-and-build.outputs.image-tag }}
