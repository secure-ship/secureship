name: secureship-pipeline

on:
  workflow_call:
    inputs:
      app-path:
        required: false
        default: ""
        type: string
      image-name:
        required: false
        default: ""
        type: string
      severity-cutoff:
        required: false
        default: ""
        type: string
      build-branch:
        required: false
        default: ""
        type: string
      run-gitleaks:
        required: false
        default: ""
        type: string
      run-semgrep:
        required: false
        default: ""
        type: string
      run-trivy:
        required: false
        default: ""
        type: string
      run-hadolint:
        required: false
        default: ""
        type: string
      run-grype:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  config:
    name: Load config
    runs-on: ubuntu-latest
    outputs:
      app-path: ${{ steps.cfg.outputs.app-path }}
      image-name: ${{ steps.cfg.outputs.image-name }}
      severity-cutoff: ${{ steps.cfg.outputs.severity-cutoff }}
      build-branch: ${{ steps.cfg.outputs.build-branch }}
      run-gitleaks: ${{ steps.cfg.outputs.run-gitleaks }}
      run-semgrep: ${{ steps.cfg.outputs.run-semgrep }}
      run-trivy: ${{ steps.cfg.outputs.run-trivy }}
      run-hadolint: ${{ steps.cfg.outputs.run-hadolint }}
      run-grype: ${{ steps.cfg.outputs.run-grype }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve options (input > secureship.yml > default)
        id: cfg
        env:
          IN_APP_PATH: ${{ inputs.app-path }}
          IN_IMAGE_NAME: ${{ inputs.image-name }}
          IN_SEVERITY: ${{ inputs.severity-cutoff }}
          IN_BUILD_BRANCH: ${{ inputs.build-branch }}
          IN_GITLEAKS: ${{ inputs.run-gitleaks }}
          IN_SEMGREP: ${{ inputs.run-semgrep }}
          IN_TRIVY: ${{ inputs.run-trivy }}
          IN_HADOLINT: ${{ inputs.run-hadolint }}
          IN_GRYPE: ${{ inputs.run-grype }}
        run: |
          fileval() {
            [ -f secureship.yml ] || return 0
            v=$(yq "$1" secureship.yml)
            [ "$v" = "null" ] && v=""
            echo "$v"
          }
          pick() {
            if [ -n "$1" ]; then echo "$1"; return; fi
            f=$(fileval "$2")
            if [ -n "$f" ]; then echo "$f"; else echo "$3"; fi
          }
          {
            echo "app-path=$(pick "$IN_APP_PATH" '.app-path' '.')"
            echo "image-name=$(pick "$IN_IMAGE_NAME" '.image-name' 'app')"
            echo "severity-cutoff=$(pick "$IN_SEVERITY" '.severity-cutoff' 'CRITICAL')"
            echo "build-branch=$(pick "$IN_BUILD_BRANCH" '.build-branch' 'main')"
            echo "run-gitleaks=$(pick "$IN_GITLEAKS" '.scanners.gitleaks' 'true')"
            echo "run-semgrep=$(pick "$IN_SEMGREP" '.scanners.semgrep' 'true')"
            echo "run-trivy=$(pick "$IN_TRIVY" '.scanners.trivy' 'true')"
            echo "run-hadolint=$(pick "$IN_HADOLINT" '.scanners.hadolint' 'true')"
            echo "run-grype=$(pick "$IN_GRYPE" '.scanners.grype' 'true')"
          } | tee -a "$GITHUB_OUTPUT"

  secrets-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    needs: config
    if: ${{ needs.config.outputs.run-gitleaks == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks JSON report
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git --source /repo --redact --exit-code 0 --report-format json --report-path /repo/reports/gitleaks.json

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks.json

      - name: Gitleaks SARIF report
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git --source /repo --redact --exit-code 0 --report-format sarif --report-path /repo/reports/gitleaks.sarif

      - name: Upload Gitleaks SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

      - name: Run Gitleaks (gate)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --no-git --source /repo --redact -v

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: config
    if: ${{ needs.config.outputs.run-semgrep == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep JSON report
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --config p/java --config p/owasp-top-ten --json --output /src/reports/semgrep.json ${{ needs.config.outputs.app-path }}/src

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep.json

      - name: Semgrep SARIF report
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --config p/java --config p/owasp-top-ten --sarif --output /src/reports/semgrep.sarif ${{ needs.config.outputs.app-path }}/src

      - name: Upload Semgrep SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Run Semgrep (gate)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --config p/java --config p/owasp-top-ten --error ${{ needs.config.outputs.app-path }}/src

  dependency-scan:
    name: Dependencies (Trivy)
    runs-on: ubuntu-latest
    needs: config
    if: ${{ needs.config.outputs.run-trivy == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Map severity cutoff for Trivy
        run: |
          case "${{ needs.config.outputs.severity-cutoff }}" in
            CRITICAL) echo "TRIVY_SEV=CRITICAL" >> $GITHUB_ENV ;;
            HIGH) echo "TRIVY_SEV=HIGH,CRITICAL" >> $GITHUB_ENV ;;
            MEDIUM) echo "TRIVY_SEV=MEDIUM,HIGH,CRITICAL" >> $GITHUB_ENV ;;
            *) echo "TRIVY_SEV=LOW,MEDIUM,HIGH,CRITICAL" >> $GITHUB_ENV ;;
          esac

      - name: Trivy JSON report
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs --scanners vuln,misconfig --severity ${{ env.TRIVY_SEV }} --exit-code 0 --offline-scan --skip-dirs target --format json --output /work/reports/trivy-deps.json /work/${{ needs.config.outputs.app-path }}

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-deps-report
          path: reports/trivy-deps.json

      - name: Trivy SARIF report
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs --scanners vuln,misconfig --severity ${{ env.TRIVY_SEV }} --exit-code 0 --offline-scan --skip-dirs target --format sarif --output /work/reports/trivy-deps.sarif /work/${{ needs.config.outputs.app-path }}

      - name: Upload Trivy SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-deps.sarif
          category: trivy-deps

      - name: Run Trivy (gate)
        run: docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs --scanners vuln,misconfig --severity ${{ env.TRIVY_SEV }} --exit-code 1 --offline-scan --skip-dirs target /work/${{ needs.config.outputs.app-path }}

  dockerfile-lint:
    name: Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    needs: config
    if: ${{ needs.config.outputs.run-hadolint == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint JSON report
        run: |
          mkdir -p reports
          docker run --rm -i hadolint/hadolint hadolint --format json - < ${{ needs.config.outputs.app-path }}/Dockerfile > reports/hadolint.json || true

      - name: Upload Hadolint report
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-report
          path: reports/hadolint.json

      - name: Hadolint SARIF report
        run: |
          docker run --rm -i hadolint/hadolint hadolint --format sarif - < ${{ needs.config.outputs.app-path }}/Dockerfile > reports/hadolint.sarif || true

      - name: Upload Hadolint SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/hadolint.sarif
          category: hadolint

      - name: Run Hadolint (gate)
        run: docker run --rm -i hadolint/hadolint hadolint --failure-threshold warning - < ${{ needs.config.outputs.app-path }}/Dockerfile

  build-and-sign:
    name: Build, SBOM & Sign
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref_name == needs.config.outputs.build-branch }}
    needs: [config, secrets-scan, sast, dependency-scan, dockerfile-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        run: |
          REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$REPO_LOWER/${{ needs.config.outputs.image-name }}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local only)
        uses: docker/build-push-action@v5
        id: build
        with:
          context: ./${{ needs.config.outputs.app-path }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_TAG }}

      - name: Grype JSON report
        if: ${{ needs.config.outputs.run-grype == 'true' }}
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:latest ${{ env.IMAGE_TAG }} -o json > reports/grype.json

      - name: Upload Grype report
        if: ${{ needs.config.outputs.run-grype == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: reports/grype.json

      - name: Grype SARIF report
        if: ${{ needs.config.outputs.run-grype == 'true' }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:latest ${{ env.IMAGE_TAG }} -o sarif > reports/grype.sarif

      - name: Upload Grype SARIF to Code Scanning
        if: ${{ needs.config.outputs.run-grype == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/grype.sarif
          category: grype

      - name: Scan Local Image (Grype)
        if: ${{ needs.config.outputs.run-grype == 'true' }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:latest ${{ env.IMAGE_TAG }} -o table --fail-on ${{ needs.config.outputs.severity-cutoff }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.IMAGE_TAG }}

      - name: Get Image Digest
        run: |
          D=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "DIGEST=${IMAGE_TAG%:*}@${D}" >> $GITHUB_ENV

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DIGEST }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Sign the image by digest
        run: cosign sign --yes ${{ env.DIGEST }}

      - name: Attach SBOM as attestation
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.DIGEST }}

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.DIGEST }}

      - name: Verify SBOM attestation
        run: |
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.DIGEST }} > /dev/null
