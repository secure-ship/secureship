apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
spec:
  validationFailureAction: Audit
  background: false
  webhookTimeoutSeconds: 30
  rules:
  - name: verify-cosign-keyless
    match:
      any:
      - resources:
          kinds: [Pod]
          namespaces: [notes]
    verifyImages:
    - imageReferences:
      - "ghcr.io/secure-ship/secureship/*"
      mutateDigest: false
      verifyDigest: false
      required: true
      attestors:
      - entries:
        - keyless:
            issuer: https://token.actions.githubusercontent.com
            subjectRegExp: "^https://github.com/secure-ship/secureship/.*"
            rekor:
              url: https://rekor.sigstore.dev
